name: Release

on:
  push:
    branches: [main]

# A PR or tag created with the default GITHUB_TOKEN does not trigger other workflows, so CI
# (including the API version check) would not run on the release PR. Set the RELEASE_PLZ_TOKEN
# secret (fine-grained PAT or GitHub App token with contents + pull-requests write) to avoid that.
env:
  RELEASE_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  # Creates the tag vX.Y.Z and the GitHub Release when the release PR is merged.
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'spirali'
    permissions:
      contents: write
    env:
      OASDIFF_VERSION: 1.34.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install oasdiff
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Enforced once the version is bumped, so a release whose commit types understate an API
      # change is never tagged.
      - name: Check version bump against API changes since the last release
        run: python scripts/check_api_version.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5.144
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}

  # Opens or updates the "chore: release vX.Y.Z" PR (version bump + CHANGELOG).
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'spirali'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5.144
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
