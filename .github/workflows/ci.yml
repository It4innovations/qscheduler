name: CI

on:
  push:
    # release-plz-*: a pushed release branch gets the full CI before a PR is opened
    branches: [main, "release-plz-*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-build:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: typos
        uses: crate-ci/typos@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Python test deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt

      - name: ruff format --check
        run: .venv/bin/ruff format --check tests

      - name: ruff check
        run: .venv/bin/ruff check tests

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Only on main and releases (release-plz-* branch or `chore: release` PR), not feature PRs
      - uses: taiki-e/install-action@v2
        if: >-
          github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
          || startsWith(github.event.pull_request.title, 'chore: release')
        with:
          tool: cargo-audit

      - name: cargo audit
        if: >-
          github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
          || startsWith(github.event.pull_request.title, 'chore: release')
        run: cargo audit

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release -p qscheduler

      - uses: actions/upload-artifact@v4
        with:
          name: qscheduler-binary
          path: target/release/qscheduler
          if-no-files-found: error

  api-compat:
    name: API Version Check
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: 1.34.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release tags are the baseline

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install oasdiff
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check version bump against API changes since the last release
        run: python scripts/check_api_version.py

  test:
    name: Test
    needs: check-and-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: xpass11
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:xpass11@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qscheduler-binary
          path: ./artifact

      - name: Make binary executable
        run: chmod +x ./artifact/qscheduler

      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Python test deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt

      - name: Run pytest
        env:
          QSCHEDULER_BIN: ${{ github.workspace }}/artifact/qscheduler
        run: .venv/bin/pytest -v

      - name: Upload pytest artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: /tmp/pytest-of-*/**
          if-no-files-found: ignore

  docker-smoke-test:
    name: Docker Image Smoke Test
    needs: check-and-build
    # Only on main and releases (release-plz-* branch or `chore: release` PR), not feature PRs
    if: >-
      github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
      || startsWith(github.event.pull_request.title, 'chore: release')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: xpass11
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qscheduler .

      - name: Register a test-backend machine
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://postgres:xpass11@localhost/postgres \
            qscheduler machine add TestMachine test

      - name: Start the service
        run: |
          docker run -d --name qscheduler --network host \
            -e DATABASE_URL=postgres://postgres:xpass11@localhost/postgres \
            qscheduler serve --port 4300

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4300/health; then exit 0; fi
            sleep 1
          done
          echo "Service did not become healthy in time"
          exit 1

      - name: Register a project and submit a task
        run: |
          set -e
          curl -sf -X POST http://localhost:4300/projects \
            -H 'Content-Type: application/json' \
            -d '{"name": "smoke-project", "limit_ms": 3600000}'

          task_id=$(curl -sf -X POST 'http://localhost:4300/tasks?machine=TestMachine&project=smoke-project&user=ci' \
            -H 'Content-Type: application/octet-stream' \
            --data-raw '{"outcome": {"type": "Ok"}}')

          for i in $(seq 1 30); do
            state=$(curl -sf http://localhost:4300/tasks/$task_id | jq -r .state)
            echo "task $task_id state: $state"
            if [ "$state" = "finished" ]; then exit 0; fi
            if [ "$state" = "failed" ] || [ "$state" = "cancelled" ]; then
              echo "task ended in unexpected state: $state"
              exit 1
            fi
            sleep 1
          done
          echo "task did not finish in time"
          exit 1

      - name: Dump service logs on failure
        if: failure()
        run: docker logs qscheduler || true
